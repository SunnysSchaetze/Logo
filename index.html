<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Animiertes Logo – Sunny's Schätze</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: black;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            text-align: center;
            color: white;
            font-family: sans-serif;
        }

        video {
            width: 100%;
            height: auto;
            display: block;
        }

        .description {
            margin-bottom: 1rem;
            font-size: 1rem;
            line-height: 1.4;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- Screenreader-only Kurzbeschreibung -->
    <p class="sr-only">
        Animiertes Logo von Sunny's Schätze mit Drachen und Gaming-Thema.
    </p>

    <!-- Sichtbare Beschreibung (steht IMMER vor dem Video in Google Sites sauber) -->
    <p class="description">
        Das animierte Logo zeigt einen Drachen auf einer Schatztruhe mit Gaming- und Sammelobjekten,
        Sternen und einem leuchtenden RGB-Hintergrund.
    </p>

    <video
        autoplay
        muted
        loop
        playsinline
        aria-label="Animiertes Logo von Sunny's Schätze"
        poster="logo-poster.jpg"
    >
        <source src="Sunnys Schätze Logo Animiert.mp4" type="video/mp4">
        Dein Browser unterstützt das Video nicht.
    </video>

</div>

</body>
</html>
